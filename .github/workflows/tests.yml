# Step 8
# Add a workflow, or a job in your existing one, 
# that installs the requirements and runs pytest on every push.

name: Test API
on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest 

    steps:
      - name: Checkout code 
        uses: actions/checkout@v5

      - name: Set up Python 
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -s ./tests/test_forecast.py
          python -m pytest -s ./tests/test_forecast_schema.py

